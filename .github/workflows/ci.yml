name: CI  # Nome do workflow (aparece no GitHub Actions)

on:
  push:
    branches:
      - "**"  # Dispara o pipeline em qualquer commit em qualquer branch

jobs:
  # ========================
  # JOB 1: BUILD
  # ========================
  build:
    runs-on: ubuntu-latest  # Máquina virtual Linux

    steps:
      # Baixa o código do repositório
      - uses: actions/checkout@v4

      # Instala Java 21 + cache do Maven (acelera build)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Compila o projeto e gera o .jar (sem rodar testes)
      - name: Build
        run: ./mvnw package -DskipTests

      # Salva o .jar como artefato para outros jobs usarem
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar


  # ========================
  # JOB 2: TEST (COM MATRIX)
  # ========================
  test:
    needs: build  # Só roda depois do build passar
    runs-on: ${{ matrix.os }}  # SO varia pela matrix

    strategy:
      fail-fast: false  # Não cancela os outros testes se um falhar
      matrix:
        os: [ubuntu-latest, windows-latest]  # Testa em Linux e Windows
        java: [17, 21]  # Testa em duas versões de Java

    # Sobe um container MongoDB para testes de integração
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017

    steps:
      # Baixa o código novamente (cada job roda em VM isolada)
      - uses: actions/checkout@v4

      # Instala a versão de Java definida na matrix
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      # Baixa o .jar gerado no job de build
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      # Executa os testes (unitários + integração)
      - name: Test
        run: ./mvnw test